<script>
(function () {
  function boot(msg){ document.getElementById('root').innerHTML = '<div class="boot">' + msg + '</div>'; }
  function fail(reason){
    boot('<b>Couldn\'t start the prototype.</b><br><br>' + reason +
      '<br><br>This page needs an internet connection to load React. If you are online and it still fails, ' +
      'your network may be blocking unpkg.com and jsdelivr.net — try the hosted link instead.');
  }
  function loadOne(urls, done){
    var i = 0;
    (function attempt(){
      if (i >= urls.length){ done(new Error('sources failed')); return; }
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = function(){ done(null); };
      s.onerror = function(){ attempt(); };
      document.head.appendChild(s);
    })();
  }
  function loadAll(list, done){
    (function next(i){
      if (i >= list.length){ done(null); return; }
      loadOne(list[i], function(err){ if (err){ done(err); return; } next(i+1); });
    })(0);
  }
  var libs = [
    ['https://unpkg.com/react@18/umd/react.production.min.js',
     'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js'],
    ['https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
     'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js']
  ];
  var watchdog = setTimeout(function(){ fail('Loading React timed out.'); }, 15000);
  loadAll(libs, function(err){
    clearTimeout(watchdog);
    if (err || typeof React === 'undefined' || typeof ReactDOM === 'undefined'){ fail('React did not load.'); return; }
    try { window.__boot(); }
    catch (e){ fail('The app failed to run: ' + (e && e.message ? e.message : e)); }
  });
  window.addEventListener('error', function(e){
    if (document.querySelector('#root .boot')) fail('Error: ' + (e.message || 'unknown'));
  });
})();
</script>
